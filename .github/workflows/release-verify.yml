name: Proofloom independent release evidence
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-verify.yml'
      - 'scripts/actions-identity.mjs'
      - 'scripts/release-verifier.mjs'
  workflow_dispatch:
  schedule:
    - cron: '5-55/10 * * * *'
permissions:
  contents: read
  checks: read
  id-token: write
concurrency:
  group: proofloom-release-verifier
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate signed independent verifier identity
        run: node scripts/oidc-diagnostic.mjs verifier
      - name: Verify merged GitHub artifacts and live production behavior
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROOFLOOM_BASE_URL: https://proofloom-global-web-production.up.railway.app
        run: node scripts/release-verifier.mjs
