name: Proofloom bounded GitHub bridge
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bridge-runner.yml'
      - 'scripts/actions-identity.mjs'
      - 'scripts/github-bridge.mjs'
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'
permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write
  id-token: write
concurrency:
  group: proofloom-bridge-runner
  cancel-in-progress: false
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Dispatch and reconcile bounded translation WorkPackets
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PROOFLOOM_BASE_URL: https://proofloom-global-web-production.up.railway.app
          PROOFLOOM_MAX_PACKETS: '3'
          PROOFLOOM_AUTO_MERGE: 'true'
        run: node scripts/github-bridge.mjs
