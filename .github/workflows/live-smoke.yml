name: Proofloom live release smoke
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: proofloom-live-smoke
  cancel-in-progress: false
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify exact deployed SHA and critical live routes
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: node scripts/live-smoke.mjs
